<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Project | Project Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f3;
      color: #14213d;
    }
    .topbar {
      height: 76px;
      background: #f1efe9;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 44px; height: 44px; border-radius: 10px; background: #c46a1d; color: white;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .brand h2 { margin: 0; font-size: 18px; }
    .brand span { font-size: 12px; color: #64748b; }
    .back-btn {
      border: 1px solid #dbe1ea; background: #f1efe9; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .main { max-width: 980px; margin: 30px auto; padding: 0 20px 40px; }
    .page-header { margin-bottom: 18px; }
    .page-header h1 { margin: 0 0 8px; font-size: 30px; }
    .page-header p { margin: 0; color: #64748b; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 24px;
      box-shadow: 0 4px 12px rgba(20,33,61,0.04);
    }
    form { display: grid; gap: 20px; }
    .section {
      border: 1px solid #edf1f5; background: #fafafa; border-radius: 12px; padding: 18px;
    }
    .section h3 { margin: 0 0 14px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #27364a; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #d7dfe8; border-radius: 8px; font-size: 14px;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .primary-btn, .secondary-btn {
      border: none; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer;
    }
    .primary-btn { background: #c46a1d; color: white; }
    .secondary-btn { background: #e5e7eb; color: #14213d; }
    .message { display: none; padding: 12px 14px; border-radius: 8px; margin-top: 10px; }
    .message.success { display: block; background: #edfdf5; color: #186a3b; border: 1px solid #bfead0; }
    .message.error { display: block; background: #fff1f2; color: #991b1b; border: 1px solid #fecdd3; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { padding: 0 15px; }
      .brand span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-building-columns"></i></div>
      <div>
        <h2>Project Intelligence</h2>
        <span>Infrastructure Monitoring System</span>
      </div>
    </div>
    <button class="back-btn" id="backBtn">Back</button>
  </header>

  <main class="main">
    <div class="page-header">
      <h1>Add Project</h1>
      <p>Create a new project and assign it to the relevant contractor/officer.</p>
    </div>

    <div class="card">
      <form id="addProjectForm">
        <div class="section">
          <h3>Basic Details</h3>
          <div class="grid">
            <label class="field">
              <span>Project ID</span>
              <input type="text" id="project_id" required />
            </label>
            <label class="field">
              <span>Project Name</span>
              <input type="text" id="project_name" required />
            </label>
            <label class="field">
              <span>Sector</span>
              <input type="text" id="sector" required />
            </label>
            <label class="field">
              <span>Project Type</span>
              <input type="text" id="project_type" />
            </label>
            <label class="field">
              <span>Ministry</span>
              <input type="text" id="ministry" />
            </label>
            <label class="field">
              <span>State</span>
              <input type="text" id="state" />
            </label>
            <label class="field">
              <span>Place</span>
              <input type="text" id="place" />
            </label>
            <label class="field">
              <span>Implementing Agency</span>
              <input type="text" id="implementing_agency" />
            </label>
          </div>
        </div>

        <div class="section">
          <h3>Budget & Timeline</h3>
          <div class="grid">
            <label class="field">
              <span>Budget (₹ Cr)</span>
              <input type="number" id="budget" step="0.01" min="0" />
            </label>
            <label class="field">
              <span>Expenditure (₹ Cr)</span>
              <input type="number" id="expenditure" step="0.01" min="0" />
            </label>
            <label class="field">
              <span>Progress (%)</span>
              <input type="number" id="progress" min="0" max="100" value="0" />
            </label>
            <label class="field">
              <span>Status</span>
              <select id="status">
                <option value="Active">Active</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Delayed">Delayed</option>
                <option value="Completed">Completed</option>
                <option value="On Hold">On Hold</option>
              </select>
            </label>
            <label class="field">
              <span>Start Date</span>
              <input type="date" id="start_date" />
            </label>
            <label class="field">
              <span>End Date</span>
              <input type="date" id="end_date" />
            </label>
          </div>
        </div>

        <div class="section">
          <h3>Assignment</h3>
          <div class="grid">
            <label class="field">
              <span>Assigned Contractor ID</span>
              <input type="text" id="contractor_id" />
            </label>
            <label class="field">
              <span>Assigned Officer ID</span>
              <input type="text" id="officer_id" />
            </label>
          </div>
        </div>

        <div class="section">
          <h3>Notes</h3>
          <div class="field">
            <span>Description</span>
            <textarea id="description"></textarea>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="primary-btn">Create Project</button>
          <button type="button" class="secondary-btn" id="cancelBtn">Cancel</button>
        </div>

        <div id="messageBox" class="message"></div>
      </form>
    </div>
  </main>

  <script>
    const qs = new URLSearchParams(window.location.search);
    const user = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
    const messageBox = document.getElementById('messageBox');

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.className = `message ${isError ? 'error' : 'success'}`;
    }

    function applyLoggedInRoleDefaults() {
      if (!user) return;
      const role = user.role;
      const officerId = user.user?.officer_id || '';
      const contractorId = user.user?.contractor_id || '';

      if (role === 'government') {
        document.getElementById('officer_id').value = officerId;
      }

      if (role === 'contractor') {
        document.getElementById('contractor_id').value = contractorId;
      }
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'projects.html';
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      window.location.href = 'projects.html';
    });

    document.getElementById('addProjectForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        project_id: document.getElementById('project_id').value.trim(),
        project_name: document.getElementById('project_name').value.trim(),
        place: document.getElementById('place').value.trim(),
        state: document.getElementById('state').value.trim(),
        ministry: document.getElementById('ministry').value.trim(),
        sector: document.getElementById('sector').value.trim(),
        project_type: document.getElementById('project_type').value.trim(),
        budget: document.getElementById('budget').value,
        status: document.getElementById('status').value,
        progress: document.getElementById('progress').value,
        expenditure: document.getElementById('expenditure').value,
        start_date: document.getElementById('start_date').value,
        end_date: document.getElementById('end_date').value,
        contractor_id: document.getElementById('contractor_id').value.trim(),
        officer_id: document.getElementById('officer_id').value.trim(),
        implementing_agency: document.getElementById('implementing_agency').value.trim(),
        description: document.getElementById('description').value.trim()
      };

      if (!payload.project_id || !payload.project_name || !payload.sector) {
        showMessage('Project ID, project name and sector are required.', true);
        return;
      }

      try {
        const response = await fetch('/dashboard-api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Project creation failed.');
        }

        showMessage('Project created successfully.');
        setTimeout(() => {
          window.location.href = 'projects.html';
        }, 800);
      } catch (error) {
        showMessage(error.message || 'Failed to create project.', true);
      }
    });

    if (qs.get('role') === 'contractor') {
      document.getElementById('contractor_id').value = qs.get('contractorId') || '';
      document.getElementById('officer_id').value = '';
    }

    if (qs.get('role') === 'government') {
      document.getElementById('officer_id').value = qs.get('officerId') || '';
    }

    applyLoggedInRoleDefaults();
  </script>
</body>
</html>
